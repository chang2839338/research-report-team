<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research Report Team</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="last-updated">최종변경일시 2026-05-27 13:29</div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="mark">AI</span>
          <h1>보고서 작업</h1>
        </div>

        <form id="runForm" class="run-form">
          <label class="field">
            <span>보고서 제목</span>
            <input id="titleInput" type="text" autocomplete="off" placeholder="예: 시장 진입 전략 보고서" />
          </label>

          <label class="field">
            <span>보고서 내용</span>
            <textarea id="briefInput" rows="10" placeholder="목표, 배경, 독자, 원하는 산출물을 적어주세요."></textarea>
          </label>

          <button id="runButton" class="run-button" type="submit">
            <span aria-hidden="true">▶</span>
            <span>작업 실행</span>
          </button>
        </form>

        <section class="runs-panel" aria-label="recent runs">
          <p class="section-label">최근 작업</p>
          <div id="runList" class="run-list"></div>
        </section>
      </aside>

      <main class="workspace">
        <header class="workspace-head">
          <h2 id="workspaceTitle">보고서 작업을 시작하세요</h2>
          <p id="statusMessage">대기</p>
        </header>

        <section class="progress-panel" aria-label="workflow progress">
          <p class="section-label">진행 단계</p>
          <ol id="stepList" class="step-list"></ol>
        </section>

        <section class="output-grid">
          <article class="output-panel">
            <div class="panel-head">
              <div>
                <p class="section-label" id="selectedRole">Manager</p>
                <h3 id="selectedLabel">Task Brief</h3>
              </div>
              <div class="panel-meta">
                <span id="selectedTokens" class="token-badge">토큰 -</span>
                <span id="selectedState" class="state-badge">대기</span>
              </div>
            </div>
            <div id="subtabs" class="subtabs" role="tablist" aria-label="selected role files"></div>
            <div id="detailViewer" class="markdown-viewer">진행 단계에서 Agent를 선택하세요.</div>
          </article>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
